AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  プリキュアオールスターズいえるかなクイズ - Backend API
  Session management and leaderboard system

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref LeaderboardTable
        SITE_BUCKET: !Ref SiteBucketName
        CORS_ORIGIN: !Ref CorsOrigin
        RECORDS_VERSION: !Ref RecordsVersion
        # 署名鍵（SESSION_SECRET / ADMIN_SECRET）は必要な関数にだけ個別に渡す

Parameters:
  RecordsVersion:
    Type: String
    Description: >-
      Leaderboard records version. "1" maps to the legacy unversioned keys
      (leaderboard / pendings); other values use suffixed keys like
      "leaderboard#v2". Bump this when the quiz composition changes to start
      a fresh board while keeping old records intact.
    Default: "2"
  SiteBucketName:
    Type: String
    Description: S3 bucket name for the site (used to write leaderboard.json)
  SessionSecret:
    Type: String
    Description: Secret key for HMAC session tokens (min 32 chars)
    NoEcho: true
  CorsOrigin:
    Type: String
    Description: Allowed CORS origin (e.g. https://example.com)
    Default: "*"
  AdminEmail:
    Type: String
    Description: Admin email address for rank-in notifications (empty to disable)
    Default: ""
  SenderEmail:
    Type: String
    Description: SES verified sender email address (empty to disable notifications)
    Default: ""
  AdminSecret:
    Type: String
    Description: Secret key for admin operations (approve/reject). Used to sign email action links.
    NoEcho: true

Resources:
  # --- CloudWatch Logs ---
  # API Gateway HTTP API のアクセスログ出力先（保持期間 90 日）
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${HttpApi}/access-log"
      RetentionInDays: 90

  # Lambda 関数のログ出力先（保持期間 90 日）
  # 明示的に定義することで保持期間を制御（未定義の場合は Lambda が自動作成し永久保持）
  SessionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/allstars-session
      RetentionInDays: 90

  ScoreLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/allstars-score
      RetentionInDays: 90

  AdminLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/allstars-admin
      RetentionInDays: 90

  DigestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/allstars-digest
      RetentionInDays: 90

  # --- API Gateway (HTTP API) ---
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      # アクセスログを CloudWatch Logs に出力（JSON 形式）
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","path":"$context.path","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency","responseLatency":"$context.responseLatency","userAgent":"$context.identity.userAgent"}
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
        MaxAge: 86400
      # スロットリング：API 全体で毎秒 10 リクエスト（瞬間最大 20）に制限
      # クイズ開始時とランクイン時にしか呼ばれないため通常利用では到達しない
      # 大量リクエストによる課金増・監査ログの押し流しを抑止する
      # 超過時は 429 が返り、クイズ本体は動作する（ランキング登録のみ不可）
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20

  # --- Lambda: Session ---
  SessionFunction:
    Type: AWS::Serverless::Function
    DependsOn: SessionLogGroup
    Properties:
      FunctionName: allstars-session
      Handler: index.handler
      CodeUri: lambda/session/
      Environment:
        Variables:
          # セッショントークンの HMAC 署名鍵
          SESSION_SECRET: !Ref SessionSecret
      Events:
        GetSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/session
            Method: GET

  # --- Lambda: Score ---
  # ハイスコア送信は稀な操作のため、同時実行数を厳しく制限
  ScoreFunction:
    Type: AWS::Serverless::Function
    DependsOn: ScoreLogGroup
    Properties:
      FunctionName: allstars-score
      Handler: index.handler
      CodeUri: lambda/score/
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          TABLE_NAME: !Ref LeaderboardTable
          SITE_BUCKET: !Ref SiteBucketName
          SESSION_SECRET: !Ref SessionSecret
          CORS_ORIGIN: !Ref CorsOrigin
          # ランクイン通知メールの設定（空文字の場合は通知無効）
          ADMIN_EMAIL: !Ref AdminEmail
          SENDER_EMAIL: !Ref SenderEmail
          # 管理操作用署名鍵（承認/却下リンクの HMAC 生成に使用）
          ADMIN_SECRET: !Ref AdminSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeaderboardTable
        # S3 への書き込みは leaderboard.json の更新のみに限定
        # （サイト本体の HTML/JS を Lambda から書き換えられないようにする）
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::${SiteBucketName}/leaderboard.json"
        # SES によるランクイン通知メール送信権限
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        PostScore:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/score
            Method: POST

  # --- Lambda: Admin ---
  # メール内リンクからの承認/却下操作を処理
  # 管理者がメールのボタンをクリックすると直接このLambdaが呼ばれる
  AdminFunction:
    Type: AWS::Serverless::Function
    DependsOn: AdminLogGroup
    Properties:
      FunctionName: allstars-admin
      Handler: index.handler
      CodeUri: lambda/admin/
      Environment:
        Variables:
          TABLE_NAME: !Ref LeaderboardTable
          SITE_BUCKET: !Ref SiteBucketName
          # 管理操作用署名鍵（メールリンクの HMAC 検証に使用）
          ADMIN_SECRET: !Ref AdminSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeaderboardTable
        # S3 への書き込みは leaderboard.json の更新のみに限定
        # （サイト本体の HTML/JS を Lambda から書き換えられないようにする）
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::${SiteBucketName}/leaderboard.json"
      Events:
        # 承認リンク（GET /api/admin/approve?name=xxx&sig=yyy）
        Approve:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/approve
            Method: GET
        # 却下リンク（GET /api/admin/reject?name=xxx&sig=yyy）
        Reject:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/admin/reject
            Method: GET

  # --- Lambda: Digest ---
  # 自動承認の日次レポート
  # 毎朝 8:30 (JST) に起動し、過去24時間に自動承認があった場合のみ
  # まとめて管理者にメールでレポートする（無ければ何も送信しない）
  DigestFunction:
    Type: AWS::Serverless::Function
    DependsOn: DigestLogGroup
    Properties:
      FunctionName: allstars-digest
      Handler: index.handler
      CodeUri: lambda/digest/
      Environment:
        Variables:
          TABLE_NAME: !Ref LeaderboardTable
          ADMIN_EMAIL: !Ref AdminEmail
          SENDER_EMAIL: !Ref SenderEmail
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeaderboardTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        # EventBridge の cron は UTC 指定：23:30 UTC = 翌 08:30 JST（日本は夏時間なし）
        DailyReport:
          Type: Schedule
          Properties:
            Schedule: cron(30 23 * * ? *)
            Description: Daily auto-approval report at 08:30 JST

  # --- DynamoDB ---
  # pk="leaderboard"   : ランキング本体（entries 配列 + clientInfo、上位100件）
  # pk="pendings"      : 承認待ちスコア（entries マップ、名前キー、30日で除去）
  # pk="audits"        : 監査ログ（logs 配列、最大100件、30日で除去）
  # pk="tokens"        : 使用済みトークン（nonces マップ、有効期限切れは自動除去）
  # pk="autoapprovals" : 自動承認の記録（events 配列、48時間で除去、日次レポート用）
  # pk="shadows"       : シャドウ対象端末（entries 配列、30日で除去）
  LeaderboardTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: allstars-leaderboard
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  LeaderboardTableName:
    Description: DynamoDB table name
    Value: !Ref LeaderboardTable
  # API Gateway アクセスログの出力先ロググループ名
  ApiAccessLogGroupName:
    Description: CloudWatch Logs group for API Gateway access logs
    Value: !Ref ApiAccessLogGroup
